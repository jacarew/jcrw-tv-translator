apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.jcrw.translator'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jcrw.translator.tv'
        minSdk 24
        targetSdk 28
        versionCode 19
        versionName '1.1.8'
    }
    flavorDimensions 'edition'
    productFlavors {
        publicRelease { dimension 'edition' }
        personal { dimension 'edition' }
    }
    lint { disable 'ExpiredTargetSdkVersion' }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
    def signingFile = rootProject.file('../android/release-signing.properties')
    if (signingFile.exists()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs {
            publicRelease {
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
        buildTypes { release { signingConfig signingConfigs.publicRelease } }
    }
    // A local TV update may reuse the developer's existing debug certificate.
    // Set JCRW_PERSONAL_DEBUG_KEYSTORE only on the machine that owns that key.
    def personalDebugStore = System.getenv('JCRW_PERSONAL_DEBUG_KEYSTORE')
    if (personalDebugStore) {
        signingConfigs {
            personalTvDebug {
                storeFile file(personalDebugStore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        buildTypes { debug { signingConfig signingConfigs.personalTvDebug } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
